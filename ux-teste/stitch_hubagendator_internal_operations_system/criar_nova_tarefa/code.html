  function setDeadline(shortcutText, previewText) {
    const input = document.getElementById('dueDateInput');
    const status = document.getElementById('deadlineStatus');
    if (input && status) {
      input.value = shortcutText;
      status.innerHTML = `<span class="material-symbols-outlined text-[14px]">schedule</span> ${previewText}`;
    }
  }

  function submitTask() {
    const titleInput = document.getElementById('taskTitle');
    if (titleInput && !titleInput.value.trim()) {
      titleInput.focus();
      titleInput.parentElement.classList.add('bg-error-container');
      setTimeout(() => {
        titleInput.parentElement.classList.remove('bg-error-container');
      }, 1500);
      return;
    }

    const toast = document.getElementById('toastNotification');
    if (toast) {
      toast.classList.remove('opacity-0', 'translate-y-[-10px]');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-10px]');
        toast.classList.remove('opacity-100', 'translate-y-0');
        if (window.history.length > 1) {
          window.history.back();
        }
      }, 1400);
    }
  }
</script></main></body></html>
