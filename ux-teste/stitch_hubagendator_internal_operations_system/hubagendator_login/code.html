        </p>

<span class="material-symbols-outlined text-[15px] text-outline">lock</span>
<span class="font-label-sm text-label-sm tracking-normal">Ambiente restrito • Somente equipe autorizada</span>
</div>
<form class="w-full flex flex-col gap-space-md" id="loginForm" onsubmit="handleLogin(event)">

<label class="font-label-lg text-label-lg text-on-surface" for="corporateEmail">E-mail corporativo</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[18px]">alternate_email</span>
<input class="w-full h-9 pl-9 pr-3 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none transition-colors" id="corporateEmail" placeholder="seu.nome@hubsolucao.com.br" required="" type="email" value="carlos@hubsolucao.com.br"/>
</div>
</div>
<div class="flex flex-col gap-space-2xs">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface" for="userPassword">Senha</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="javascript:void(0)" onclick="alert('Instruções de recuperação enviadas ao e-mail institucional cadastrado.')">
              Esqueci minha senha
            </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[18px]">key</span>
<input class="w-full h-9 pl-9 pr-10 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none transition-colors" id="userPassword" placeholder="••••••••" required="" type="password" value="senhaOperacao2025"/>
<button aria-label="Alternar visibilidade da senha" class="absolute right-2 p-1 text-outline hover:text-on-surface flex items-center justify-center transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<button class="w-full h-9 mt-space-xs bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg rounded-lg flex items-center justify-center gap-space-xs shadow-sm transition-all active:scale-[0.99]" id="submitBtn" type="submit">
<span id="btnText">Entrar na Operação</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="w-full flex items-center gap-space-xs my-space-base">
<div class="flex-1 h-px bg-surface-container-high"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Atalhos de Homologação</span>
<div class="flex-1 h-px bg-surface-container-high"></div>
</div>

<button class="w-full p-space-xs bg-surface-container-low hover:bg-surface-container rounded-lg flex items-center justify-between text-left transition-colors group" onclick="setPersona('carlos@hubsolucao.com.br', 'Carlos Mendes', 'Gestor Operacional')" type="button">
<div class="flex items-center gap-space-xs min-w-0">

              CM
            </div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface truncate">Carlos (Gestor)</span>
<span class="font-label-sm text-label-sm text-outline truncate">carlos@hubsolucao.com.br</span>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary text-[18px]">badge</span>
</button>
<button class="w-full p-space-xs bg-surface-container-low hover:bg-surface-container rounded-lg flex items-center justify-between text-left transition-colors group" onclick="setPersona('gisele@hubsolucao.com.br', 'Gisele Soares', 'Técnica de Campo')" type="button">
<div class="flex items-center gap-space-xs min-w-0">
<div class="w-7 h-7 rounded-full bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center shrink-0 font-label-md text-label-md">
              GS
            </div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface truncate">Gisele (Colaboradora)</span>
<span class="font-label-sm text-label-sm text-outline truncate">gisele@hubsolucao.com.br</span>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary text-[18px]">badge</span>
</button>
</div>
<div class="mt-space-lg flex items-center justify-center gap-space-2xs text-outline">
<span class="material-symbols-outlined text-[14px]">verified_user</span>
<span class="font-label-sm text-label-sm">HubAgendator v2.4 • Criptografia ponta a ponta</span>
</div>
</div>
<div class="mt-space-md text-center">
<p class="font-label-sm text-label-sm text-outline">
        © Hub Soluções Integradas • Suporte Técnico: ramal 4022
      </p>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('userPassword');
    const eyeIcon = document.getElementById('eyeIcon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function setPersona(email, name, role) {
    const emailField = document.getElementById('corporateEmail');
    const passwordField = document.getElementById('userPassword');
    emailField.value = email;
    passwordField.value = 'hub@2025secure';
    
    const feedback = document.createElement('div');
    feedback.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-space-base py-space-xs rounded-full font-label-md text-label-md shadow-lg flex items-center gap-space-2xs z-50 transition-all';
    feedback.innerHTML = '<span class="material-symbols-outlined text-[16px] text-secondary-fixed-dim">check_circle</span> Perfil selecionado: ' + name;
    document.body.appendChild(feedback);
    setTimeout(() => {
      feedback.remove();
    }, 2200);
  }

  function handleLogin(event) {
    event.preventDefault();
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    btn.disabled = true;
    btn.classList.add('opacity-75');
    btnText.textContent = 'Autenticando sessão...';
    
    setTimeout(() => {
      btnText.textContent = 'Conectado!';
      btn.classList.remove('opacity-75');
      btn.classList.replace('bg-primary', 'bg-tertiary');
      setTimeout(() => {
        btnText.textContent = 'Entrar na Operação';
        btn.disabled = false;
        btn.classList.replace('bg-tertiary', 'bg-primary');
      }, 1500);
    }, 900);
  }
</script></main></body></html>
